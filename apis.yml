name: Complori
description: >-
  Complori is a Berlin, Germany based online education company that teaches
  children and young people to code through live, small-group video classes led
  by qualified coaches in a protected digital space. Its programs span
  programming with Minecraft, Python, JavaScript game development, app
  development, and financial literacy, backed by a learning platform with
  challenges and exercises, a mobile learning app, completion certificates,
  flexible family-friendly scheduling, and holiday camps. Complori operates a
  B2C consumer education service (with parents as the decision-makers) rather
  than a developer-facing API product, and runs an education scholarship program
  to broaden access across socioeconomic backgrounds. Backed by Speedinvest.
